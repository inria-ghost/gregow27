image: julia:1.10
    
pages:
  stage: deploy
  script:
    - julia --project=@. -e 'import Pkg; Pkg.instantiate();
      using NodeJS; run(`$(npm_cmd()) install highlight.js`);
      using Franklin;
      optimize()'
    - mv __site public
  artifacts:
    paths:
      - public
  only:
    - main

